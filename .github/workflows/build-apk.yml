name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libltdl-dev \
            pkg-config cmake \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=0.29,<3.1"
          python -m pip install buildozer
          buildozer --version

      - name: Probar núcleo Python
        run: |
          python -m pip install pytest pillow
          PYTHONPATH=. pytest -q

      - name: Limpiar compilación anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer -v android debug

      - name: Mostrar APK generado
        if: success()
        run: |
          find bin -type f -maxdepth 2 -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Optimizer-APK
          path: bin/*.apk
          if-no-files-found: error
