name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**.py"
      - "requirements.txt"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libltdl-dev \
            pkg-config cmake \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==3.0.12"
          python -m pip install buildozer pytest pillow
          buildozer --version

      - name: Test core
        run: PYTHONPATH=. pytest -q

      # Sin cache durante la fase de depuración: evita reutilizar builds rotos.
      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -f buildozer-build.log

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: Show generated APK
        if: success()
        run: find bin -maxdepth 2 -type f -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Optimizer-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-failure-log
          path: buildozer-build.log
          if-no-files-found: warn
